services:
  workspace-bench:
    build:
      context: ../..
      dockerfile: evaluation/docker/Dockerfile
      network: host
    image: workspace-bench:local
    network_mode: host
    working_dir: /workspace/Workspace-Bench/evaluation
    tty: true
    stdin_open: true
    env_file:
      - path: ../.env
        required: false
    environment:
      WORKSPACE_BENCH_ROOT: /workspace/Workspace-Bench
      WORKSPACE_BENCH_EVAL_ROOT: /workspace/Workspace-Bench/evaluation
      RIP_BENCH_ROOT: /workspace/Workspace-Bench
      RIP_BENCH_EVAL_ROOT: /workspace/Workspace-Bench/evaluation
      DEEPAGENTS_ROOT: /workspace/Workspace-Bench/deepagents
      CODEX_SANDBOX_MODE: danger-full-access
      YIYI_OPENDATABOX_PROJECT_ROOT: /workspace/OpenDataBox
      OPENDATABOX_PROJECT_ROOT: /workspace/OpenDataBox
      YIYI_CARGO_ROOT: /workspace/OpenDataBox/YiYi/app/src-tauri
      YIYI_DOCKER_TARGET_DIR: /workspace/.cargo-target/yiyi
      YIYI_EVAL_BIN: /workspace/.cargo-target/yiyi/debug/eval
      YIYI_HOME: /root/.yiyi
      WORKSPACE_BENCH_EXTERNAL_DATA_ROOT: /workspace/tmp-workspace-bench-evaluation
    volumes:
      - ../..:/workspace/Workspace-Bench
      - ../../..:/workspace/OpenDataBox
      - ${WORKSPACE_BENCH_DATA_ROOT:-/home/yukai/project/tmp/Workspace-Bench/evaluation}:/workspace/tmp-workspace-bench-evaluation
      - ${YIYI_HOME_HOST:-${HOME}/.yiyi}:/root/.yiyi:ro
      - cargo-cache:/root/.cargo
      - rustup-cache:/root/.rustup
      - cargo-target:/workspace/.cargo-target
      - pip-cache:/root/.cache/pip
      - uv-cache:/root/.cache/uv
      - npm-cache:/root/.npm
      - openclaw-home:/root/.openclaw

volumes:
  pip-cache:
  uv-cache:
  npm-cache:
  openclaw-home:
  cargo-cache:
  rustup-cache:
  cargo-target:
